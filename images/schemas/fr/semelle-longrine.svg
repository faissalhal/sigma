text x="750" y="582" font-size="17" font-weight="800" fill="#1f2328" text-anchor="middle">8</text><g filter="url(#ombre)"><rect x="812" y="106" width="364" height="562" rx="16" fill="#fff" stroke="#d5dae1"/></g><g filter="url(#ombre2)"><circle cx="848" cy="144" r="17" fill="#f5b400" stroke="#fff" stroke-width="3"/></g><text x="848" y="150" font-size="17" font-weight="800" fill="#1f2328" text-anchor="middle">1</text><text x="878" y="150" font-size="18" font-weight="700" fill="#1f2328" text-anchor="start">Poteau (b = 25 cm)</text><text x="878" y="174" font-size="15.5" fill="#5b6470" text-anchor="start">et ses attentes ancrées dans la semelle</text><g filter="url(#ombre2)"><circle cx="848" cy="208" r="17" fill="#f5b400" stroke="#fff" stroke-width="3"/></g><text x="848" y="214" font-size="17" font-weight="800" fill="#1f2328" text-anchor="middle">2</text><text x="878" y="214" font-size="18" font-weight="700" fill="#1f2328" text-anchor="start">Semelle : B = 1,25 m</text><text x="878" y="238" font-size="15.5" fill="#5b6470" text-anchor="start">Surface = charge ÷ contrainte du sol</text><g filter="url(#ombre2)"><circle cx="848" cy="272" r="17" fill="#f5b400" stroke="#fff" stroke-width="3"/></g><text x="848" y="278" font-size="17" font-weight="800" fill="#1f2328" text-anchor="middle">3</text><text x="878" y="278" font-size="18" font-weight="700" fill="#1f2328" text-anchor="start">Hauteur utile ≥ (B − b) / 4</text><text x="878" y="302" font-size="15.5" fill="#5b6470" text-anchor="start">Ici au moins 25 cm, plus l&#x27;enrobage</text><g filter="url(#ombre2)"><circle cx="848" cy="336" r="17" fill="#f5b400" stroke="#fff" stroke-width="3"/></g><text x="848" y="342" font-size="17" font-weight="800" fill="#1f2328" text-anchor="middle">4</text><text x="878" y="342" font-size="18" font-weight="700" fill="#1f2328" text-anchor="start">Nappe inférieure</text><text x="878" y="366" font-size="15.5" fill="#5b6470" text-anchor="start">Aciers dans les deux sens</text><g filter="url(#ombre2)"><circle cx="848" cy="400" r="17" fill="#f5b400" stroke="#fff" stroke-width="3"/></g><text x="848" y="406" font-size="17" font-weight="800" fill="#1f2328" text-anchor="middle">5</text><text x="878" y="406" font-size="18" font-weight="700" fill="#1f2328" text-anchor="start">Béton de propreté</text><text x="878" y="430" font-size="15.5" fill="#5b6470" text-anchor="start">Quelques cm de béton maigre</text><g filter="url(#ombre2)"><circle cx="848" cy="464" r="17" fill="#f5b400" stroke="#fff" stroke-width="3"/></g><text x="848" y="470" font-size="17" font-weight="800" fill="#1f2328" text-anchor="middle">6</text><text x="878" y="470" font-size="18" font-weight="700" fill="#1f2328" text-anchor="start">Longrine</text><text x="878" y="494" font-size="15.5" fill="#5b6470" text-anchor="start">Relie les semelles (exigée par le RPS)</text><g filter="url(#ombre2)"><circle cx="848" cy="528" r="17" fill="#f5b400" stroke="#fff" stroke-width="3"/></g><text x="848" y="534" font-size="17" font-weight="800" fill="#1f2328" text-anchor="middle">7</text><text x="878" y="534" font-size="18" font-weight="700" fill="#1f2328" text-anchor="start">Enrobage renforcé</text><text x="878" y="558" font-size="15.5" fill="#5b6470" text-anchor="start">Béton coulé contre la terre</text><g filter="url(#ombre2)"><circle cx="848" cy="592" r="17" fill="#f5b400" stroke="#fff" stroke-width="3"/></g><text x="848" y="598" font-size="17" font-weight="800" fill="#1f2328" text-anchor="middle">8</text><text x="878" y="598" font-size="18" font-weight="700" fill="#1f2328" text-anchor="start">Niveau d&#x27;assise</text><text x="878" y="622" font-size="15.5" fill="#5b6470" text-anchor="start">Donné par l&#x27;étude de sol</text><line x1="32" y1="716" x2="1168" y2="716" stroke="#d5dae1"/><text x="32" y="742" font-size="14" font-weight="400" fill="#5b6470" text-anchor="start" >Exemple : poteau de 300 kN sur un sol à 2 bars. Dimensions et ferraillage à déterminer par l&#x27;ingénieur.</text><text x="1168" y="742" font-size